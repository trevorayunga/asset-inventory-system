<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue Import | AssetTrack</title>
  <meta name="description" content="Search the DummyJSON product catalogue and import products into your inventory.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <strong>AssetTrack</strong>
        <span>Assets &amp; inventory</span>
      </div>
      <nav aria-label="Main">
        <ul>
          <li><a href="index.html">Dashboard</a></li>
          <li><a href="items.html">Items</a></li>
          <li><a href="catalogue.html" aria-current="page">Catalogue Import</a></li>
          <li><a href="movements.html">Movements</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <span>Acme Operations</span>
        <span>Alex Morgan · Admin</span>
      </div>
    </aside>
    <div class="content">
      <header class="topbar">
        <h1>Catalogue Import</h1>
      </header>
      <main id="main">
        <form class="search-bar" id="search-form" role="search" aria-label="Search the online catalogue">
          <div class="field grow">
            <label for="catalogue-search" class="visually-hidden">Search online catalogue</label>
            <input id="catalogue-search" type="search" placeholder="Search online catalogue by product name" autocomplete="off">
          </div>
          <button type="submit" class="btn btn-primary">Search</button>
          <p class="muted">Source: DummyJSON</p>
        </form>

        <section aria-labelledby="catalogue-title" class="stack">
          <div class="section-head">
            <h2 id="catalogue-title">Online product catalogue</h2>
            <p class="muted" id="catalogue-count" aria-live="polite"></p>
          </div>
          <div id="catalogue-state" aria-live="polite"></div>
          <div class="product-grid" id="product-grid" hidden></div>
        </section>
      </main>
      <footer class="page-footer">
        <span>Acme Operations</span>
        <time id="today"></time>
      </footer>
    </div>
  </div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <script type="module" src="js/pages/catalogue.js"></script>
</body>
</html>
