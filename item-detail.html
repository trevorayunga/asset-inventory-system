<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Item detail | AssetTrack</title>
  <meta name="description" content="Item summary and full movement history.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <strong>AssetTrack</strong>
        <span>Assets &amp; inventory</span>
      </div>
      <nav aria-label="Main">
        <ul>
          <li><a href="index.html">Dashboard</a></li>
          <li><a href="items.html">Items</a></li>
          <li><a href="catalogue.html">Catalogue Import</a></li>
          <li><a href="movements.html">Movements</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <span>Acme Operations</span>
        <span>Alex Morgan · Admin</span>
      </div>
    </aside>
    <div class="content">
      <header class="topbar">
        <h1>Item detail</h1>
        <button type="button" class="btn btn-primary" id="record-movement">Record movement</button>
      </header>
      <main id="main">
        <div id="detail-state" aria-live="polite"></div>
        <div id="detail-content" class="stack" hidden>
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="items.html">← Items</a> <span aria-hidden="true">/</span> <span id="crumb-name"></span>
          </nav>

          <section class="card card-pad stack" aria-labelledby="item-title">
            <div class="section-head">
              <div>
                <h2 id="item-title" class="title-lg"></h2>
                <p class="muted" id="item-kind"></p>
              </div>
              <div class="badge-row" id="item-badges"></div>
            </div>
            <dl class="facts">
              <div><dt>SKU</dt><dd id="d-sku"></dd></div>
              <div><dt>Quantity</dt><dd id="d-quantity"></dd></div>
              <div><dt>Unit cost</dt><dd id="d-cost"></dd></div>
              <div><dt>Assigned to</dt><dd id="d-assigned"></dd></div>
            </dl>
            <div class="section-head">
              <div class="btn-row">
                <button type="button" class="btn btn-secondary" id="edit-item">Edit</button>
                <button type="button" class="btn btn-primary" id="assign-return">Assign / Return</button>
                <button type="button" class="btn btn-primary" id="restock-issue">Restock / Issue</button>
                <button type="button" class="btn btn-secondary" id="delete-item">Delete</button>
              </div>
              <p class="muted" id="d-value"></p>
            </div>
          </section>

          <section class="card" aria-labelledby="history-heading">
            <div class="card-pad"><h2 id="history-heading">Movement History</h2></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th scope="col">Date</th><th scope="col">Action</th><th scope="col">Quantity</th><th scope="col">Note</th></tr>
                </thead>
                <tbody id="history-body"></tbody>
              </table>
            </div>
            <footer class="table-footer">
              <p class="muted" id="history-count"></p>
              <p class="muted" id="history-note"></p>
            </footer>
          </section>
        </div>
      </main>
      <footer class="page-footer">
        <span>Acme Operations</span>
        <time id="today"></time>
      </footer>
    </div>
  </div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <script type="module" src="js/pages/itemDetail.js"></script>
</body>
</html>
